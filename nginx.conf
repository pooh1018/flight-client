# AWS ECS环境的前端配置 - 适用于/etc/nginx/conf.d/目录
# 前端端口: 80
# 后端API: 动态设置 (通过环境变量 BACKEND_API_URL)

# 注意：此配置文件设计为放在/etc/nginx/conf.d/目录下
# 不包含全局指令如user、worker_processes等，这些应在主nginx.conf中定义

server {
    listen 80;
    server_name _;  # 匹配所有域名
    root /usr/share/nginx/html;  # 前端打包文件的存放路径
    index index.html;

    # 安全相关头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 静态资源缓存策略 - 针对哈希文件名的资源（如webpack生成的带哈希的js/css文件）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg).*$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # 字体文件缓存
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # HTML文件 - 不缓存
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # 清单文件 - 不缓存
    location ~* (manifest\.json|asset-manifest\.json|service-worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # API请求代理 - 处理所有/api开头的请求
    location /api {
        proxy_pass ${BACKEND_API_URL};  # 后端API地址，将通过环境变量动态设置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 增加超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 处理SPA路由 - 所有非文件请求都返回index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;  # 确保index.html不被缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
